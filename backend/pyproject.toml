[project]
name = "sqlmon-backend"
version = "0.1.0"
description = "SQL Server 实时会话监控平台后端服务"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pyodbc>=5.2.0",
  "PyJWT>=2.10.0",
  "bcrypt>=4.2.0",
  "APScheduler>=3.10.4",
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
